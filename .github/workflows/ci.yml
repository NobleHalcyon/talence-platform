name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "greenfield/**"

permissions:
  contents: read

jobs:
  web-and-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run canon:validate
      - run: npm run guard:architecture
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:contracts
      - run: npm run build

  catalog-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/catalog-worker/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "./services/catalog-worker[dev]"
      - run: python -m ruff check services/catalog-worker
      - run: python -m ruff format --check services/catalog-worker
      - run: python -m mypy services/catalog-worker/src
      - run: python -m pytest services/catalog-worker/tests

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx supabase start
      - run: npx supabase db reset
      - run: npm run db:lint
      - run: npm run db:types:check
      - run: npx supabase test db

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
