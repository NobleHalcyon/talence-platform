openapi: 3.1.0
info:
  title: Talence Device API
  version: 1.0.0
  description: >-
    Stable contract for Talence robots, scanners, kiosks, and approved
    third-party machines. Human browser APIs are not comprehensively described here.
servers:
  - url: https://example.talence.app/api/v1
    description: Placeholder production origin
security:
  - DeviceBearer: []
tags:
  - name: Device
  - name: Catalog
  - name: Inventory
  - name: Runs
paths:
  /device/me:
    get:
      tags: [Device]
      operationId: getDeviceIdentity
      responses:
        '200':
          description: Authenticated device identity and grants
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceMeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /device/heartbeat:
    post:
      tags: [Device]
      operationId: postDeviceHeartbeat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HeartbeatRequest'
      responses:
        '200':
          description: Heartbeat accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcknowledgementResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /device/catalog/manifest:
    get:
      tags: [Catalog]
      operationId: getCatalogManifest
      parameters:
        - in: query
          name: current_version
          required: false
          schema:
            type: string
            maxLength: 160
        - in: query
          name: client_version
          required: true
          schema:
            type: string
        - in: query
          name: supported_schema_versions
          required: true
          description: Comma-separated positive integers
          schema:
            type: string
            pattern: '^\d+(,\d+)*$'
      responses:
        '200':
          description: Latest compatible manifest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogManifestResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
  /device/collections/{collection_id}/inventory-batches:
    post:
      tags: [Inventory]
      operationId: postDeviceInventoryBatch
      parameters:
        - $ref: '#/components/parameters/CollectionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryBatchRequest'
      responses:
        '200':
          description: Existing stored result returned for an identical replay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryBatchResponse'
        '201':
          description: Batch accepted and committed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryBatchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
  /device/collections/{collection_id}/inventory:
    get:
      tags: [Inventory]
      operationId: getGrantedCollectionInventory
      parameters:
        - $ref: '#/components/parameters/CollectionId'
        - in: query
          name: cursor
          required: false
          schema:
            type: string
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: Paginated inventory balances for a granted collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryPageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /device/runs:
    post:
      tags: [Runs]
      operationId: postDeviceRunSummary
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunSummaryRequest'
      responses:
        '200':
          description: Existing idempotent result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunSummaryResponse'
        '201':
          description: Run summary accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunSummaryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
components:
  securitySchemes:
    DeviceBearer:
      type: http
      scheme: bearer
      bearerFormat: TalenceDeviceCredential
  parameters:
    CollectionId:
      in: path
      name: collection_id
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 200
  responses:
    BadRequest:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Credential missing or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Device lacks the required grant
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Idempotency, catalog compatibility, or state conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PayloadTooLarge:
      description: Request body or line count exceeds configured limit
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Request rate or quota exceeded
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    Meta:
      type: object
      additionalProperties: false
      required: [request_id]
      properties:
        request_id:
          type: string
          format: uuid
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error, meta]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
        meta:
          $ref: '#/components/schemas/Meta'
    AcknowledgementResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [accepted, server_time]
          properties:
            accepted:
              type: boolean
            server_time:
              type: string
              format: date-time
        meta:
          $ref: '#/components/schemas/Meta'
    DeviceGrant:
      type: object
      additionalProperties: false
      required: [collection_id, permissions]
      properties:
        collection_id:
          type: string
          format: uuid
        permissions:
          type: array
          uniqueItems: true
          items:
            enum: [inventory_read, inventory_write, run_summary_write]
    DeviceMeResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [device_id, workspace_id, name, type, status, grants, api_version, server_time]
          properties:
            device_id:
              type: string
              format: uuid
            workspace_id:
              type: string
              format: uuid
            name:
              type: string
            type:
              enum: [talence_sorter, scanner, kiosk, third_party]
            status:
              enum: [active, suspended, revoked]
            grants:
              type: array
              items:
                $ref: '#/components/schemas/DeviceGrant'
            api_version:
              const: 'v1'
            server_time:
              type: string
              format: date-time
        meta:
          $ref: '#/components/schemas/Meta'
    HeartbeatRequest:
      type: object
      additionalProperties: false
      required: [schema_version, client_version, catalog_snapshot_version]
      properties:
        schema_version:
          const: 1
        client_version:
          type: string
          minLength: 1
          maxLength: 80
        firmware_version:
          type: [string, 'null']
          maxLength: 80
        catalog_snapshot_version:
          type: [string, 'null']
          maxLength: 160
        health:
          type: object
          maxProperties: 20
          additionalProperties:
            type: [string, number, integer, boolean, 'null']
    CatalogManifestResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: true
          description: Must validate against catalog-snapshot-manifest.schema.json
        meta:
          $ref: '#/components/schemas/Meta'
    InventoryLine:
      type: object
      additionalProperties: false
      required: [line_id, printing_id, finish, condition, quantity_delta]
      properties:
        line_id:
          type: string
          minLength: 1
          maxLength: 128
        printing_id:
          type: string
          format: uuid
        finish:
          enum: [unknown, nonfoil, foil, etched]
        condition:
          enum: [unknown, near_mint, lightly_played, moderately_played, heavily_played, damaged]
        quantity_delta:
          type: integer
          minimum: -10000
          maximum: 10000
          not:
            const: 0
    InventoryBatchRequest:
      type: object
      additionalProperties: false
      required: [schema_version, catalog_snapshot_version, occurred_at, lines]
      properties:
        schema_version:
          const: 1
        catalog_snapshot_version:
          type: string
          minLength: 1
          maxLength: 160
        occurred_at:
          type: string
          format: date-time
        external_run_id:
          type: [string, 'null']
          maxLength: 128
        lines:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/InventoryLine'
        metadata:
          type: object
          maxProperties: 20
          additionalProperties:
            type: [string, number, integer, boolean, 'null']
    InventoryResultLine:
      type: object
      additionalProperties: false
      required: [line_id, printing_id, quantity_before, quantity_after]
      properties:
        line_id:
          type: string
        printing_id:
          type: string
          format: uuid
        quantity_before:
          type: integer
          minimum: 0
        quantity_after:
          type: integer
          minimum: 0
    InventoryBatchResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [batch_id, transaction_id, collection_id, committed_at, replayed, lines]
          properties:
            batch_id:
              type: string
              format: uuid
            transaction_id:
              type: string
              format: uuid
            collection_id:
              type: string
              format: uuid
            committed_at:
              type: string
              format: date-time
            replayed:
              type: boolean
            lines:
              type: array
              items:
                $ref: '#/components/schemas/InventoryResultLine'
        meta:
          $ref: '#/components/schemas/Meta'
    InventoryBalance:
      type: object
      additionalProperties: false
      required: [printing_id, finish, condition, quantity, updated_at]
      properties:
        printing_id:
          type: string
          format: uuid
        finish:
          enum: [unknown, nonfoil, foil, etched]
        condition:
          enum: [unknown, near_mint, lightly_played, moderately_played, heavily_played, damaged]
        quantity:
          type: integer
          minimum: 0
        updated_at:
          type: string
          format: date-time
    InventoryPageResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/InventoryBalance'
        meta:
          type: object
          additionalProperties: false
          required: [request_id, next_cursor]
          properties:
            request_id:
              type: string
              format: uuid
            next_cursor:
              type: [string, 'null']
    RunCounts:
      type: object
      additionalProperties: false
      required: [total, recognized, unrecognized, posted]
      properties:
        total:
          type: integer
          minimum: 0
        recognized:
          type: integer
          minimum: 0
        unrecognized:
          type: integer
          minimum: 0
        posted:
          type: integer
          minimum: 0
    RunSummaryRequest:
      type: object
      additionalProperties: false
      required: [schema_version, external_run_id, collection_id, status, catalog_snapshot_version, started_at, completed_at, counts]
      properties:
        schema_version:
          const: 1
        external_run_id:
          type: string
          minLength: 1
          maxLength: 128
        collection_id:
          type: string
          format: uuid
        status:
          enum: [completed, failed, cancelled, partially_posted]
        catalog_snapshot_version:
          type: string
          minLength: 1
          maxLength: 160
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        counts:
          $ref: '#/components/schemas/RunCounts'
        diagnostic_code:
          type: [string, 'null']
          maxLength: 128
        metadata:
          type: object
          maxProperties: 20
          additionalProperties:
            type: [string, number, integer, boolean, 'null']
    RunSummaryResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [run_summary_id, external_run_id, accepted_at, replayed]
          properties:
            run_summary_id:
              type: string
              format: uuid
            external_run_id:
              type: string
            accepted_at:
              type: string
              format: date-time
            replayed:
              type: boolean
        meta:
          $ref: '#/components/schemas/Meta'
