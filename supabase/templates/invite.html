<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Accept your Talence invitation</title>
  </head>
  <body>
    <h1>You are invited to Talence</h1>
    <p>
      A Talence platform administrator invited you to join the private beta. Use the secure one-time
      link below to complete your account.
    </p>
    <p>
      <a
        href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&amp;type=invite&amp;next=%2Finvite%2Fcomplete"
      >
        Accept invitation
      </a>
    </p>
    <p>If you were not expecting this invitation, you can ignore this email.</p>
  </body>
</html>
