<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset your Talence password</title>
  </head>
  <body>
    <h1>Reset your Talence password</h1>
    <p>
      A password reset was requested for your admitted Talence account. Use the secure one-time link
      below to choose a new password.
    </p>
    <p>
      <a
        href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&amp;type=recovery&amp;next=%2Freset-password"
      >
        Reset password
      </a>
    </p>
    <p>If you did not request this change, you can ignore this email.</p>
  </body>
</html>
