# Talence local Supabase configuration.
# Reference: https://supabase.com/docs/guides/local-development/cli/config
#
# This file contains local-only, non-secret settings. Hosted project settings,
# credentials, CAPTCHA, SMTP, and hosted hook activation are documented
# separately.

project_id = "talence-platform"

[api]
enabled = true
port = 54321
# Private schemas such as app_private must never be added here.
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[api.tls]
enabled = false

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
# The private-beta architecture does not require Realtime.
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
# Local invitation and recovery emails are captured here rather than delivered.
enabled = true
port = 54324
smtp_port = 54325

[storage]
enabled = true
# The private catalog-snapshots bucket has its own 1 GiB object ceiling.
# Inventory imports retain their much smaller bucket-level limit.
file_size_limit = "1GiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/auth/callback?type=invite&next=/invite/complete",
  "http://127.0.0.1:3000/auth/callback?type=invite&next=/invite/complete",
  "http://localhost:3000/auth/callback?type=recovery&next=/reset-password",
  "http://127.0.0.1:3000/auth/callback?type=recovery&next=/reset-password",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Account creation is restricted to the trusted administrative invitation flow.
enable_signup = false
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 8

[auth.email]
# Keep email/password available for admin invitations, sign-in, and recovery.
# The global auth.enable_signup switch above still blocks public self-signup.
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

[auth.email.template.invite]
subject = "You are invited to Talence"
content_path = "./supabase/templates/invite.html"

[auth.email.template.recovery]
subject = "Reset your Talence password"
content_path = "./supabase/templates/recovery.html"

[auth.rate_limit]
# Local browser coverage issues several disposable messages in one run.
# Hosted limits remain deliberately operator-managed.
email_sent = 30

[auth.sms]
enable_signup = false
enable_confirmations = false

[auth.hook.before_user_created]
enabled = true
uri = "pg-functions://postgres/app_private/before_user_created_hook"
